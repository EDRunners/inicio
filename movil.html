<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Evitar zoom para mantener la sensación de App Nativa -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EDRunners | Tienda Móvil</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== VARIABLES Y TEMA ========== */
        :root {
            --bg-color: #0f1012;
            --surface-color: #1a1b1e;
            --surface-hover: #232428;
            --primary-color: #10b981;
            --primary-active: #059669;
            --text-light: #ffffff;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-light); padding-bottom: 90px; overflow-x: hidden; }
        
        /* ========== HEADER & SEARCH ========== */
        .app-header {
            position: sticky; top: 0; z-index: 100;
            background: rgba(15, 16, 18, 0.85); backdrop-filter: blur(12px);
            padding: 15px 20px 10px; border-bottom: 1px solid var(--border-color);
        }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .logo { font-size: 1.4rem; font-weight: 700; color: var(--text-light); letter-spacing: -0.5px; }
        .currency-toggle { background: var(--surface-color); border: 1px solid var(--border-color); color: var(--text-light); padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        
        .search-container { position: relative; width: 100%; }
        .search-input { width: 100%; padding: 12px 15px 12px 40px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 12px; color: var(--text-light); font-size: 0.95rem; outline: none; }
        .search-input:focus { border-color: var(--primary-color); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 1.1rem; opacity: 0.6; }

        /* ========== CATEGORY CHIPS ========== */
        .filter-scroll { display: flex; overflow-x: auto; padding: 15px 20px; gap: 10px; scrollbar-width: none; border-bottom: 1px solid var(--border-color); }
        .filter-scroll::-webkit-scrollbar { display: none; }
        .chip { padding: 8px 18px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 24px; white-space: nowrap; font-size: 0.9rem; font-weight: 600; color: var(--text-muted); transition: var(--transition); cursor: pointer; }
        .chip.active { background: var(--primary-color); border-color: var(--primary-color); color: #fff; }

        /* ========== PRODUCT GRID ========== */
        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 15px 20px; }
        .product-card { background: var(--surface-color); border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; display: flex; flex-direction: column; position: relative; }
        .product-card:active { transform: scale(0.97); }
        .product-img-box { width: 100%; height: 140px; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .product-img-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .product-info { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .p-title { font-size: 0.9rem; font-weight: 600; line-height: 1.3; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .p-price { color: var(--primary-color); font-size: 1.1rem; font-weight: 700; }
        .badge-agotado { position: absolute; top: 8px; right: 8px; background: rgba(239, 68, 68, 0.9); color: white; padding: 4px 8px; border-radius: 8px; font-size: 0.7rem; font-weight: 700; }

        /* ========== BOTTOM NAVIGATION ========== */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: rgba(26, 27, 30, 0.95); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 12px 10px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border-color); z-index: 900; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; color: var(--text-muted); cursor: pointer; position: relative; font-weight: 600; }
        .nav-item.active { color: var(--primary-color); }
        .nav-icon { font-size: 1.4rem; }
        .cart-badge { position: absolute; top: -5px; right: 5px; background: #ef4444; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; font-weight: bold; }

        /* ========== APP MODALS (BOTTOM SHEETS) ========== */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(3px); z-index: 1000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        
        .bottom-sheet { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--bg-color); border-radius: 24px 24px 0 0; z-index: 1001; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,0.5); }
        .bottom-sheet.open { transform: translateY(0); }
        
        /* Modal Handle (Barrita superior) */
        .sheet-handle-wrap { padding: 15px; display: flex; justify-content: center; align-items: center; position: relative; }
        .sheet-handle { width: 40px; height: 5px; background: var(--border-color); border-radius: 5px; }
        .close-sheet-btn { position: absolute; right: 20px; top: 12px; background: var(--surface-color); border: none; color: var(--text-light); width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; }
        
        /* Contenido del Modal de Producto */
        .sheet-content { overflow-y: auto; padding: 0 20px 20px; }
        .modal-img { width: 100%; height: 250px; object-fit: contain; background: #fff; border-radius: 16px; margin-bottom: 20px; padding: 15px; }
        .modal-title { font-size: 1.3rem; margin-bottom: 5px; line-height: 1.2; }
        .modal-price { font-size: 1.8rem; color: var(--primary-color); font-weight: 700; margin-bottom: 15px; }
        .modal-specs { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; background: var(--surface-color); padding: 15px; border-radius: 12px; white-space: pre-line; }
        
        .sheet-footer { padding: 15px 20px; padding-bottom: calc(15px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border-color); background: var(--bg-color); }
        .btn-primary { width: 100%; padding: 16px; background: var(--primary-color); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; }
        .btn-primary:active { background: var(--primary-active); transform: scale(0.98); }
        .btn-primary:disabled { background: #374151; color: #9ca3af; pointer-events: none; }

        /* Contenido del Modal de Carrito */
        .cart-item { display: flex; align-items: center; gap: 12px; background: var(--surface-color); padding: 12px; border-radius: 12px; margin-bottom: 10px; }
        .cart-item img { width: 60px; height: 60px; object-fit: contain; background: #fff; border-radius: 8px; padding: 5px; }
        .cart-item-info { flex-grow: 1; }
        .cart-item-title { font-size: 0.85rem; font-weight: 600; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .cart-item-price { color: var(--primary-color); font-weight: 700; font-size: 0.9rem; margin-top: 4px; }
        .qty-controls { display: flex; align-items: center; gap: 12px; background: var(--bg-color); padding: 5px 12px; border-radius: 8px; margin-top: 5px; width: fit-content; border: 1px solid var(--border-color); }
        .qty-btn { background: none; border: none; color: white; font-size: 1.1rem; cursor: pointer; padding: 0 5px; }
        .cart-total-box { display: flex; justify-content: space-between; align-items: center; font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; }

        /* ========== TOAST NOTIFICATION ========== */
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--primary-color); color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; font-size: 0.9rem; z-index: 2000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1); box-shadow: 0 5px 15px rgba(16,185,129,0.3); }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* Skeleton Loaders (Feedback visual) */
        .skeleton { background: linear-gradient(90deg, var(--surface-color) 25%, #2a2d32 50%, var(--surface-color) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 12px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

    </style>
</head>
<body>

    <!-- Header Fijo -->
    <header class="app-header">
        <div class="header-top">
            <div class="logo">EDRunners<span style="color:var(--primary-color)">™</span></div>
            <button id="mCurrencyBtn" class="currency-toggle">Moneda: USD</button>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="mSearch" class="search-input" placeholder="Buscar productos...">
        </div>
    </header>

    <!-- Filtros Horizontales (Chips) -->
    <div class="filter-scroll" id="mFilters">
        <div class="chip active" data-cat="todos">Todos</div>
        <!-- Chips generados por JS -->
    </div>

    <!-- Grid de Productos -->
    <main class="product-grid" id="mGrid">
        <!-- Esqueletos de carga inicial -->
        <div class="product-card skeleton" style="height: 220px;"></div>
        <div class="product-card skeleton" style="height: 220px;"></div>
        <div class="product-card skeleton" style="height: 220px;"></div>
        <div class="product-card skeleton" style="height: 220px;"></div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <span class="nav-icon">🏠</span>
            <span>Inicio</span>
        </div>
        <div class="nav-item" onclick="document.getElementById('mSearch').focus()">
            <span class="nav-icon">🔍</span>
            <span>Buscar</span>
        </div>
        <div class="nav-item" onclick="openCartModal()">
            <span class="nav-icon">🛒</span>
            <span>Carrito</span>
            <div class="cart-badge" id="mCartBadge">0</div>
        </div>
        <a href="https://wa.me/584129056964?text=Hola,%20necesito%20ayuda%20desde%20la%20App" class="nav-item" style="text-decoration:none;">
            <span class="nav-icon">💬</span>
            <span>Soporte</span>
        </a>
    </nav>

    <!-- Overlay general para los Modales -->
    <div class="modal-overlay" id="appOverlay" onclick="closeAllModals()"></div>

    <!-- MODAL DE PRODUCTO (Bottom Sheet) -->
    <div class="bottom-sheet" id="productModal">
        <div class="sheet-handle-wrap">
            <div class="sheet-handle"></div>
            <button class="close-sheet-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <div class="sheet-content">
            <img src="" alt="Producto" class="modal-img" id="modImg">
            <h2 class="modal-title" id="modTitle">Nombre del Producto</h2>
            <div class="modal-price" id="modPrice">$0.00</div>
            
            <h4 style="margin-bottom: 8px; color: var(--text-light);">Especificaciones:</h4>
            <div class="modal-specs" id="modSpecs">Detalles...</div>
        </div>
        <div class="sheet-footer">
            <button class="btn-primary" id="modAddBtn">
                🛒 Agregar al Carrito
            </button>
        </div>
    </div>

    <!-- MODAL DE CARRITO (Bottom Sheet) -->
    <div class="bottom-sheet" id="cartModal" style="height: 85vh;">
        <div class="sheet-handle-wrap">
            <div class="sheet-handle"></div>
            <h3 style="margin-left: 15px; flex-grow: 1;">Mi Carrito</h3>
            <button class="close-sheet-btn" onclick="closeAllModals()">&times;</button>
        </div>
        <div class="sheet-content" id="mCartItems" style="flex-grow: 1;">
            <!-- Items del carrito -->
        </div>
        <div class="sheet-footer">
            <div class="cart-total-box">
                <span>Total:</span>
                <span id="mCartTotal" style="color:var(--primary-color)">$0.00</span>
            </div>
            <button class="btn-primary" onclick="checkout()">
                Enviar pedido por WhatsApp
            </button>
        </div>
    </div>

    <!-- Notificación Toast -->
    <div class="toast" id="appToast">¡Agregado al carrito! 🛒</div>

    <script>
        // ========== CONFIGURACIÓN Y ESTADO ==========
        const PRODUCTS_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGjMz9Zwo1g8PruSjNcSJq6kTUQrEGkN_hQRBH0dvjIA_IwwKQ5p2pb7Bmrnvd7sLB2hMvqj-oFR6L/pub?output=csv";
        const CONFIG_CSV = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGjMz9Zwo1g8PruSjNcSJq6kTUQrEGkN_hQRBH0dvjIA_IwwKQ5p2pb7Bmrnvd7sLB2hMvqj-oFR6L/pub?gid=1&output=csv";
        
        let allProducts = [];
        let currentCategory = 'todos';
        let exchangeRate = 530.5;
        let showUSD = true;
        let cart = JSON.parse(localStorage.getItem('edrunners_cart_m')) || [];
        
        let activeProduct = null; // Para el modal

        // ========== INICIALIZACIÓN ==========
        async function initApp() {
            updateCartBadge();
            try {
                const [confRes, prodRes] = await Promise.all([fetch(CONFIG_CSV), fetch(PRODUCTS_CSV)]);
                if(confRes.ok) parseConfig(await confRes.text());
                if(prodRes.ok) {
                    allProducts = parseProducts(await prodRes.text()).reverse();
                    buildChips();
                    renderGrid(allProducts);
                }
            } catch(e) {
                document.getElementById('mGrid').innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:20px;">Sin conexión. Verifica tu internet.</p>';
            }
        }

        // ========== PARSEO DE DATOS ==========
        function parseConfig(text) {
            text.split(/\r?\n/).forEach(line => {
                if(line.toLowerCase().includes('tasa_bs_usd')) {
                    const val = parseFloat(line.split(',')[1]);
                    if(!isNaN(val)) exchangeRate = val;
                }
            });
        }

        function parseProducts(csvText) {
            const lines = csvText.split(/\r?\n/).filter(l => l.trim() !== '');
            const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
            const products = [];
            
            for(let i=1; i<lines.length; i++) {
                let values = [], inQuote = false, current = '';
                for(let ch of lines[i]) {
                    if(ch === '"') inQuote = !inQuote;
                    else if(ch === ',' && !inQuote) { values.push(current.trim()); current = ''; }
                    else current += ch;
                }
                values.push(current.trim());
                
                const getV = (key) => { const idx = headers.indexOf(key); return idx !== -1 ? values[idx] : ''; };
                const nombre = getV('nombre');
                if(!nombre) continue;

                products.push({
                    id: i, // ID interno para el modal
                    nombre: nombre,
                    especificaciones: getV('especificaciones').replace(/\\n/g, '\n'),
                    precio: getV('precio'),
                    imagen_url: getV('imagen_url') || 'https://via.placeholder.com/300?text=EDRunners',
                    categoria: getV('categoria') || 'general',
                    stock: getV('stock') || 'disponible'
                });
            }
            return products;
        }

        // ========== LÓGICA DE INTERFAZ (GRID Y CHIPS) ==========
        function formatPrice(precioStr) {
            let num = parseFloat(precioStr.replace(/[^0-9.]/g, '')) || 0;
            return showUSD ? `$${num.toFixed(2)}` : `Bs ${(num * exchangeRate).toFixed(2)}`;
        }

        function buildChips() {
            const container = document.getElementById('mFilters');
            const cats = [...new Set(allProducts.map(p => p.categoria.toLowerCase()))].sort();
            
            cats.forEach(cat => {
                const div = document.createElement('div');
                div.className = 'chip';
                div.innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
                div.onclick = () => {
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    div.classList.add('active');
                    currentCategory = cat;
                    filterAndRender();
                };
                container.appendChild(div);
            });

            // Evento para el chip "Todos" original
            container.children[0].onclick = (e) => {
                document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = 'todos';
                filterAndRender();
            }
        }

        function filterAndRender() {
            const term = document.getElementById('mSearch').value.toLowerCase();
            let filtered = allProducts.filter(p => {
                const matchCat = currentCategory === 'todos' || p.categoria.toLowerCase() === currentCategory;
                const matchSearch = p.nombre.toLowerCase().includes(term) || p.especificaciones.toLowerCase().includes(term);
                return matchCat && matchSearch;
            });
            renderGrid(filtered);
        }

        function renderGrid(products) {
            const grid = document.getElementById('mGrid');
            if(products.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; margin-top:30px; color:var(--text-muted);">No hay productos en esta categoría.</p>';
                return;
            }

            grid.innerHTML = products.map(p => {
                const isAgotado = p.stock === 'agotado' || p.stock === '0';
                return `
                <div class="product-card" onclick="openProductModal(${p.id})">
                    ${isAgotado ? '<div class="badge-agotado">Agotado</div>' : ''}
                    <div class="product-img-box">
                        <img src="${p.imagen_url}" loading="lazy">
                    </div>
                    <div class="product-info">
                        <div class="p-title">${p.nombre}</div>
                        <div class="p-price">${formatPrice(p.precio)}</div>
                    </div>
                </div>`;
            }).join('');
        }

        // Buscador interactivo
        document.getElementById('mSearch').addEventListener('input', filterAndRender);

        // Cambio de Moneda
        document.getElementById('mCurrencyBtn').addEventListener('click', (e) => {
            showUSD = !showUSD;
            e.target.innerText = showUSD ? 'Moneda: USD' : 'Moneda: Bs';
            filterAndRender();
            if(activeProduct) updateModalPrice();
            renderCartModal(); // Actualiza carrito si está abierto
        });

        // ========== LÓGICA DE MODALES (BOTTOM SHEETS) ==========
        const overlay = document.getElementById('appOverlay');
        const pModal = document.getElementById('productModal');
        const cModal = document.getElementById('cartModal');

        function openProductModal(id) {
            activeProduct = allProducts.find(p => p.id === id);
            if(!activeProduct) return;

            document.getElementById('modImg').src = activeProduct.imagen_url;
            document.getElementById('modTitle').innerText = activeProduct.nombre;
            document.getElementById('modSpecs').innerText = activeProduct.especificaciones || 'Sin especificaciones detalladas.';
            updateModalPrice();

            const btn = document.getElementById('modAddBtn');
            const isAgotado = activeProduct.stock === 'agotado' || activeProduct.stock === '0';
            
            if(isAgotado) {
                btn.innerText = "Producto Agotado";
                btn.disabled = true;
            } else {
                btn.innerText = "🛒 Agregar al Carrito";
                btn.disabled = false;
                btn.onclick = () => { addToCart(activeProduct); };
            }

            overlay.classList.add('open');
            pModal.classList.add('open');
        }

        function updateModalPrice() {
            if(activeProduct) document.getElementById('modPrice').innerText = formatPrice(activeProduct.precio);
        }

        function openCartModal() {
            renderCartModal();
            overlay.classList.add('open');
            cModal.classList.add('open');
        }

        function closeAllModals() {
            overlay.classList.remove('open');
            pModal.classList.remove('open');
            cModal.classList.remove('open');
        }

        // ========== CARRITO DE COMPRAS ==========
        function saveCart() { 
            localStorage.setItem('edrunners_cart_m', JSON.stringify(cart)); 
            updateCartBadge(); 
        }

        function updateCartBadge() {
            const count = cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('mCartBadge').innerText = count;
            if(count === 0) document.getElementById('mCartBadge').style.display = 'none';
            else document.getElementById('mCartBadge').style.display = 'flex';
        }

        function addToCart(prod) {
            const numPrice = parseFloat(prod.precio.replace(/[^0-9.]/g, '')) || 0;
            const exist = cart.find(i => i.nombre === prod.nombre);
            
            if(exist) exist.qty++;
            else cart.push({ nombre: prod.nombre, precioUSD: numPrice, img: prod.imagen_url, qty: 1 });
            
            saveCart();
            closeAllModals();
            showToast();
        }

        function showToast() {
            const toast = document.getElementById('appToast');
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function renderCartModal() {
            const container = document.getElementById('mCartItems');
            if(cart.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding: 40px 20px; color:var(--text-muted);">Tu carrito está vacío.<br><br>¡Agrega algunos equipos!</div>';
                document.getElementById('mCartTotal').innerText = showUSD ? '$0.00' : 'Bs 0.00';
                return;
            }

            let totalUSD = 0;
            container.innerHTML = cart.map((item, idx) => {
                totalUSD += item.precioUSD * item.qty;
                const pDisplay = showUSD ? `$${item.precioUSD.toFixed(2)}` : `Bs ${(item.precioUSD * exchangeRate).toFixed(2)}`;
                return `
                <div class="cart-item">
                    <img src="${item.img}">
                    <div class="cart-item-info">
                        <div class="cart-item-title">${item.nombre}</div>
                        <div class="cart-item-price">${pDisplay}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                            <span style="font-weight:600; width:20px; text-align:center;">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                        </div>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('mCartTotal').innerText = showUSD ? `$${totalUSD.toFixed(2)}` : `Bs ${(totalUSD * exchangeRate).toFixed(2)}`;
        }

        function changeQty(index, delta) {
            cart[index].qty += delta;
            if(cart[index].qty <= 0) cart.splice(index, 1);
            saveCart();
            renderCartModal();
        }

        function checkout() {
            if(cart.length === 0) return;
            let msg = "¡Hola EDRunners! Quisiera concretar la compra de mi pedido:\n\n";
            cart.forEach(i => {
                msg += `▫️ ${i.qty}x ${i.nombre} ($${i.precioUSD.toFixed(2)})\n`;
            });
            msg += `\nTotal estimado: ${document.getElementById('mCartTotal').innerText}`;
            window.open(`https://wa.me/584129056964?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // Arrancar la app
        initApp();
    </script>
</body>
</html>
