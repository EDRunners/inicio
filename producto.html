<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando producto... | EDRunners</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== VARIABLES Y TEMA (Alineado con EDRunners) ========== */
        :root {
            --bg-color: #0f1012;
            --surface-color: #1a1b1e;
            --surface-hover: #232428;
            --primary-color: #10b981;
            --primary-hover: #059669;
            --text-light: #ffffff;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --glow: 0 0 25px rgba(16, 185, 129, 0.15);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.tema-claro {
            --bg-color: #f3f4f6;
            --surface-color: #ffffff;
            --surface-hover: #f9fafb;
            --text-light: #111827;
            --text-muted: #6b7280;
            --border-color: rgba(0, 0, 0, 0.08);
            --glow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-color);
            color: var(--text-light);
            line-height: 1.6;
            transition: var(--transition);
        }
        a { text-decoration: none; color: inherit; }

        /* ========== HEADER COMPACTO ========== */
        header {
            position: sticky; top: 0; z-index: 1000; width: 100%;
            background: rgba(15, 16, 18, 0.92); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); padding: 12px 0;
        }
        body.tema-claro header { background: rgba(255, 255, 255, 0.94); }
        .container { width: 100%; max-width: 1320px; margin: 0 auto; padding: 0 20px; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .logo { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.5px; white-space: nowrap; }
        .text-primary { color: var(--primary-color); }

        .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .btn-icon {
            background: var(--surface-color); border: 1px solid var(--border-color);
            color: var(--text-light); padding: 7px 11px; border-radius: 10px;
            font-weight: 600; cursor: pointer; transition: var(--transition);
            display: inline-flex; align-items: center; gap: 5px; font-size: 0.85rem;
            white-space: nowrap;
        }
        .btn-icon:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .btn-cart-top { background: var(--primary-color); color: #fff; border: none; position: relative; }
        .btn-cart-top:hover { background: var(--primary-hover); color: #fff; }
        .badge-count {
            background: #ef4444; color: #fff; border-radius: 50%;
            width: 19px; height: 19px; font-size: 0.7rem;
            display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
        }

        /* ========== BREADCRUMB ========== */
        .breadcrumb {
            padding: 12px 0; font-size: 0.82rem; color: var(--text-muted);
            display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
        }
        .breadcrumb a:hover { color: var(--primary-color); text-decoration: underline; }

        /* ========== LAYOUT PRINCIPAL (ESTILO AMAZON / ML) ========== */
        .product-main-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.1fr) minmax(0, 0.85fr);
            gap: 24px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 24px;
            box-shadow: var(--glow);
            width: 100%;
            max-width: 100%;
        }

        .product-main-grid > * { min-width: 0; max-width: 100%; }

        /* 1. GALERÍA MULTIMEDIA */
        .gallery-wrapper { display: flex; gap: 12px; align-items: flex-start; width: 100%; max-width: 100%; min-width: 0; }
        .thumbs-col { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; overflow-x: hidden; flex-shrink: 0; }
        .thumb-item {
            width: 60px; height: 60px; border-radius: 10px; background: #fff;
            border: 2px solid var(--border-color); padding: 4px; cursor: pointer;
            object-fit: contain; transition: var(--transition); flex-shrink: 0;
        }
        .thumb-item:hover, .thumb-item.active { border-color: var(--primary-color); transform: scale(1.03); }

        .main-img-box {
            flex: 1; min-width: 0; max-width: 100%; background: #fff; border-radius: 16px;
            height: 420px; display: flex; align-items: center; justify-content: center;
            padding: 16px; position: relative; overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .main-img-box img {
            max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain;
            transition: transform 0.35s ease;
        }
        .main-img-box:hover img { transform: scale(1.06); }

        /* 2. COLUMNA CENTRAL: DETALLES */
        .info-col { display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
        .tag-badge {
            display: inline-block; width: fit-content; padding: 4px 10px;
            border-radius: 6px; font-size: 0.72rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;
            background: rgba(16, 185, 129, 0.15); color: var(--primary-color);
        }
        .product-title { font-size: 1.55rem; font-weight: 700; line-height: 1.25; margin-bottom: 6px; overflow-wrap: break-word; word-break: break-word; }
        .product-sku { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; overflow-wrap: break-word; }
        .divider { height: 1px; background: var(--border-color); margin: 14px 0; }

        .highlights-title { font-size: 0.92rem; font-weight: 700; margin-bottom: 8px; }
        .highlights-list { list-style: none; display: flex; flex-direction: column; gap: 7px; }
        .highlights-list li {
            font-size: 0.88rem; color: var(--text-light); padding-left: 18px; position: relative;
            overflow-wrap: break-word; word-break: break-word;
        }
        .highlights-list li::before {
            content: "✓"; color: var(--primary-color); font-weight: 700;
            position: absolute; left: 0; top: 0;
        }

        /* 3. COLUMNA DERECHA: BUY BOX (CAJA DE COMPRA) */
        .buy-box {
            border: 1px solid var(--border-color); border-radius: 16px;
            padding: 18px; background: var(--bg-color);
            display: flex; flex-direction: column; gap: 12px; height: fit-content;
            position: sticky; top: 84px; width: 100%; max-width: 100%; min-width: 0;
        }
        .price-main { font-size: 1.85rem; font-weight: 700; color: var(--primary-color); line-height: 1.15; overflow-wrap: break-word; }
        .price-bs { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; overflow-wrap: break-word; }
        .wholesale-box {
            background: rgba(16, 185, 129, 0.08); border: 1px dashed rgba(16, 185, 129, 0.4);
            padding: 10px 12px; border-radius: 10px; font-size: 0.82rem; overflow-wrap: break-word;
        }

        .stock-status { font-weight: 700; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .stock-in { color: var(--primary-color); }
        .stock-out { color: #ef4444; }

        .qty-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 2px 0; flex-wrap: wrap; }
        .qty-selector {
            display: inline-flex; align-items: center; background: var(--surface-color);
            border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; flex-shrink: 0;
        }
        .qty-selector button {
            background: none; border: none; color: var(--text-light);
            padding: 7px 12px; font-size: 1.05rem; cursor: pointer; font-weight: 700;
        }
        .qty-selector button:hover { background: var(--surface-hover); }
        .qty-selector span { padding: 0 10px; font-weight: 600; font-size: 0.92rem; }

        .btn-buy {
            width: 100%; max-width: 100%; padding: 13px 14px; border-radius: 12px; font-weight: 700;
            font-size: 0.92rem; cursor: pointer; border: none; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-align: center;
        }
        .btn-add-cart { background: var(--primary-color); color: #fff; }
        .btn-add-cart:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .btn-whatsapp:hover:not(:disabled) { background: #1ebe5d; }
        .btn-buy:disabled { opacity: 0.5; cursor: not-allowed; }

        .trust-list {
            display: flex; flex-direction: column; gap: 7px; margin-top: 4px;
            padding-top: 12px; border-top: 1px solid var(--border-color);
            font-size: 0.78rem; color: var(--text-muted); overflow-wrap: break-word;
        }

        /* ========== DESCRIPCIÓN AMPLIA Y RELACIONADOS ========== */
        .section-card {
            margin-top: 20px; background: var(--surface-color);
            border: 1px solid var(--border-color); border-radius: 20px; padding: 22px;
            width: 100%; max-width: 100%; min-width: 0;
        }
        .section-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 12px; }
        .description-text {
            font-size: 0.92rem; color: var(--text-light); line-height: 1.65;
            white-space: pre-line; overflow-wrap: break-word; word-break: break-word;
        }

        .related-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; width: 100%;
        }
        .rel-card {
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 14px; padding: 14px; transition: var(--transition);
            display: flex; flex-direction: column; justify-content: space-between; min-width: 0;
        }
        .rel-card:hover { border-color: var(--primary-color); }
        .rel-img {
            width: 100%; height: 130px; background: #fff; border-radius: 10px;
            padding: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;
        }
        .rel-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .rel-title { font-size: 0.86rem; font-weight: 600; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .rel-price { font-size: 1rem; font-weight: 700; color: var(--primary-color); }

        /* ========== ESTADOS DE CARGA / ERROR / TOAST ========== */
        .state-box {
            text-align: center; padding: 60px 18px; background: var(--surface-color);
            border-radius: 20px; border: 1px solid var(--border-color); margin-top: 16px;
        }
        .toast {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(140px);
            background: var(--primary-color); color: #fff; padding: 12px 20px; border-radius: 12px;
            font-weight: 600; font-size: 0.88rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s ease; z-index: 3000; max-width: calc(100% - 32px); text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ========== RESPONSIVE (TABLET Y MÓVIL VERTICAL) ========== */
        @media (max-width: 1024px) {
            .product-main-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
            .buy-box { grid-column: 1 / -1; position: static; }
        }

        @media (max-width: 768px) {
            .container { padding: 0 14px; }
            .logo { font-size: 1.2rem; }
            .btn-icon { padding: 6px 9px; font-size: 0.78rem; }
            .product-main-grid {
                grid-template-columns: minmax(0, 1fr);
                padding: 14px;
                gap: 16px;
                border-radius: 16px;
            }
            .gallery-wrapper {
                flex-direction: column-reverse;
                gap: 10px;
                width: 100%;
                max-width: 100%;
            }
            .thumbs-col {
                flex-direction: row;
                width: 100%;
                max-width: 100%;
                max-height: none;
                overflow-x: auto;
                overflow-y: hidden;
                padding-bottom: 6px;
                gap: 8px;
                -webkit-overflow-scrolling: touch;
            }
            .thumb-item { width: 52px; height: 52px; }
            .main-img-box {
                width: 100%;
                max-width: 100%;
                height: 250px;
                padding: 12px;
                border-radius: 12px;
            }
            .main-img-box:hover img { transform: none; }
            .product-title { font-size: 1.22rem; }
            .price-main { font-size: 1.6rem; }
            .buy-box { padding: 14px; border-radius: 14px; }
            .section-card { padding: 16px; border-radius: 16px; margin-top: 16px; }
            .related-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
            .rel-card { padding: 10px; }
            .rel-img { height: 105px; }
        }
    </style>
</head>
<body class="tema-claro">

    <!-- Header -->
    <header>
        <div class="container header-flex">
            <a href="javascript:goBackStore()" class="logo">EDRunners <span class="text-primary">™</span></a>
            <div class="header-actions">
                <button id="currencyBtn" class="btn-icon">💰 USD</button>
                <button id="temaBtn" class="btn-icon">☀️</button>
                <a href="javascript:goBackStore()" class="btn-icon btn-cart-top">
                    🛒 <span class="badge-count" id="cartBadge">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container" style="padding-bottom: 50px;">
        <!-- Breadcrumb -->
        <nav class="breadcrumb" id="breadcrumb">
            <a href="javascript:goBackStore()">← Volver al catálogo</a>
            <span>/</span>
            <span id="bcCategory">Cargando...</span>
        </nav>

        <!-- Contenedor Dinámico Principal -->
        <div id="productContainer">
            <div class="state-box">
                <h2>Cargando ficha del producto...</h2>
                <p style="color: var(--text-muted); margin-top: 8px;">Conectando con el inventario en tiempo real</p>
            </div>
        </div>

        <!-- Descripción Detallada -->
        <section class="section-card" id="descriptionSection" style="display: none;">
            <h2 class="section-title">Descripción del Producto</h2>
            <div class="description-text" id="fullDescription"></div>
        </section>

        <!-- Productos Relacionados -->
        <section class="section-card" id="relatedSection" style="display: none;">
            <h2 class="section-title">Productos Relacionados</h2>
            <div class="related-grid" id="relatedGrid"></div>
        </section>
    </main>

    <div class="toast" id="toastMsg">✅ Producto agregado al carrito</div>

    <script>
        // ========== CONFIGURACIÓN DE DATOS ==========
        const PRODUCTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGjMz9Zwo1g8PruSjNcSJq6kTUQrEGkN_hQRBH0dvjIA_IwwKQ5p2pb7Bmrnvd7sLB2hMvqj-oFR6L/pub?output=csv";
        const CONFIG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGjMz9Zwo1g8PruSjNcSJq6kTUQrEGkN_hQRBH0dvjIA_IwwKQ5p2pb7Bmrnvd7sLB2hMvqj-oFR6L/pub?gid=1&output=csv";
        const WHATSAPP_NUMBER = "584129056964";
        const FALLBACK_IMG = "image/sin-imagen.webp";

        let allProducts = [];
        let currentProduct = null;
        let exchangeRate = 530.5;
        let showUSD = true;
        let selectedQty = 1;

        // ========== PROXY DE IMÁGENES (ANTI-BLOQUEO VENEZUELA) ==========
        function proxyImg(url) {
            if (!url || typeof url !== 'string' || url.trim() === '') return FALLBACK_IMG;
            const clean = url.trim();
            if (clean.startsWith('image/') || clean.startsWith('/')) return clean;
            if (!clean.startsWith('http')) return FALLBACK_IMG;
            if (clean.includes('wsrv.nl')) return clean;
            return `https://wsrv.nl/?url=${encodeURIComponent(clean)}`;
        }

        // ========== NAVEGACIÓN INTELIGENTE (MÓVIL O ESCRITORIO) ==========
        function goBackStore() {
            const isMobile = window.innerWidth <= 768;
            window.location.href = isMobile ? 'movil.html' : 'escritorio.html';
        }

        // ========== TEMA CLARO / OSCURO ==========
        const temaBtn = document.getElementById('temaBtn');
        if (localStorage.getItem('tema') === 'oscuro') {
            document.body.classList.remove('tema-claro');
            temaBtn.textContent = '🌙';
        }
        temaBtn.addEventListener('click', () => {
            document.body.classList.toggle('tema-claro');
            const isLight = document.body.classList.contains('tema-claro');
            localStorage.setItem('tema', isLight ? 'claro' : 'oscuro');
            temaBtn.textContent = isLight ? '☀️' : '🌙';
        });

        // ========== CARRITO SINCRONIZADO ==========
        function getCart() {
            return JSON.parse(localStorage.getItem('edrunners_cart')) || [];
        }
        function updateCartBadge() {
            const cart = getCart();
            const total = cart.reduce((acc, item) => acc + (item.quantity || item.qty || 1), 0);
            document.getElementById('cartBadge').textContent = total;
        }
        function showToast(text) {
            const t = document.getElementById('toastMsg');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2600);
        }

        // ========== PARSEO CSV ROBUSTO ==========
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && line[i+1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) return [];
            const headers = parseCSVLine(lines[0]).map(h => h.trim().toLowerCase());
            const products = [];

            for (let i = 1; i < lines.length; i++) {
                const values = parseCSVLine(lines[i]);
                if (values.length < 2) continue;

                const getVal = (key) => {
                    const idx = headers.indexOf(key);
                    return idx !== -1 && values[idx] !== undefined ? values[idx] : '';
                };

                const nombre = getVal('nombre');
                if (!nombre) continue;

                products.push({
                    orden: getVal('orden'),
                    id_producto: getVal('id_producto') || nombre.replace(/\s/g, '-').toLowerCase(),
                    nombre: nombre,
                    categoria: getVal('categoria') || 'General',
                    especificaciones: getVal('especificaciones'),
                    costo_usd: getVal('costo_usd'),
                    utilidad: getVal('utilidad'),
                    precio_detal: getVal('precio_detal'),
                    precio_mayor: getVal('precio_mayor'),
                    precio: getVal('precio') || getVal('precio_detal'),
                    precio_bs: getVal('precio_bs'),
                    stock: getVal('stock') || 'disponible',
                    etiqueta: getVal('etiqueta'),
                    imagen_url: getVal('imagen_url'),
                    imagenes_extra: getVal('imagenes_extra'),
                    descripcion: getVal('descripcion'),
                    relacionados: getVal('relacionados'),
                    amazon_link: getVal('amazon_link')
                });
            }
            return products;
        }

        // ========== FORMATEO DE PRECIOS ==========
        function parseNumericPrice(valor) {
            if (!valor) return 0;
            let limpio = String(valor).replace(/[^\d.,]/g, '').trim();
            if (!limpio) return 0;
            if (limpio.includes('.') && limpio.includes(',')) {
                if (limpio.lastIndexOf(',') > limpio.lastIndexOf('.')) {
                    limpio = limpio.replace(/\./g, '').replace(',', '.');
                } else {
                    limpio = limpio.replace(/,/g, '');
                }
            } else if (limpio.includes(',')) {
                const partes = limpio.split(',');
                if (partes[1] && partes[1].length === 3 && partes[0].length <= 3) {
                    limpio = limpio.replace(/,/g, '');
                } else {
                    limpio = limpio.replace(',', '.');
                }
            }
            return parseFloat(limpio) || 0;
        }

        function getFormattedPrices(prod) {
            const usdVal = parseNumericPrice(prod.precio_detal || prod.precio);
            let bsVal = parseNumericPrice(prod.precio_bs);
            if (bsVal === 0 && usdVal > 0) bsVal = usdVal * exchangeRate;

            const mayorVal = parseNumericPrice(prod.precio_mayor);

            return {
                usd: `$${usdVal.toFixed(2)}`,
                bs: `Bs ${bsVal.toLocaleString('es-VE', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`,
                mayor: mayorVal > 0 ? `$${mayorVal.toFixed(2)}` : null,
                rawUsd: usdVal
            };
        }

        // ========== CAMBIO DE MONEDA ==========
        const currencyBtn = document.getElementById('currencyBtn');
        currencyBtn.addEventListener('click', () => {
            showUSD = !showUSD;
            currencyBtn.textContent = showUSD ? '💰 USD' : '💰 Bs';
            if (currentProduct) {
                renderProductPage(currentProduct);
                renderRelated(currentProduct);
            }
        });

        // ========== RENDERIZADO DE LA PÁGINA DE PRODUCTO ==========
        function renderProductPage(prod) {
            document.title = `${prod.nombre} | EDRunners`;
            document.getElementById('bcCategory').textContent = prod.categoria;

            let extraImgs = [];
            if (prod.imagenes_extra) {
                extraImgs = prod.imagenes_extra.split(',')
                    .map(s => s.trim().replace(/^["']|["']$/g, ''))
                    .filter(s => s.startsWith('http'));
            }
            const rawImages = [prod.imagen_url, ...extraImgs].filter(s => s && s.trim() !== '');
            const galleryImages = rawImages.length > 0 ? rawImages.map(proxyImg) : [FALLBACK_IMG];

            const specsLines = (prod.especificaciones || 'Producto original con garantía EDRunners.')
                .split(/\r?\n|\|/)
                .map(s => s.trim())
                .filter(Boolean);

            const prices = getFormattedPrices(prod);
            const mainPriceText = showUSD ? prices.usd : prices.bs;
            const subPriceText = showUSD ? `Ref. en Bolívares: ${prices.bs}` : `Ref. en Divisas: ${prices.usd}`;

            const stockLower = String(prod.stock).toLowerCase();
            const isOutOfStock = stockLower === 'agotado' || stockLower === '0';

            const container = document.getElementById('productContainer');
            container.innerHTML = `
                <div class="product-main-grid">
                    <!-- Columna 1: Galería -->
                    <div class="gallery-wrapper">
                        <div class="thumbs-col" id="thumbsCol">
                            ${galleryImages.map((img, idx) => `
                                <img src="${img}" class="thumb-item ${idx === 0 ? 'active' : ''}" onclick="switchMainImage('${img}', this)" onerror="this.src='${FALLBACK_IMG}'" alt="Miniatura ${idx + 1}">
                            `).join('')}
                        </div>
                        <div class="main-img-box">
                            <img id="mainProductImg" src="${galleryImages[0]}" onerror="this.src='${FALLBACK_IMG}'" alt="${prod.nombre}">
                        </div>
                    </div>

                    <!-- Columna 2: Información -->
                    <div class="info-col">
                        ${prod.etiqueta ? `<span class="tag-badge">${prod.etiqueta}</span>` : ''}
                        <h1 class="product-title">${prod.nombre}</h1>
                        <div class="product-sku">Código: <strong>${prod.id_producto || 'N/A'}</strong> • Categoría: ${prod.categoria}</div>
                        
                        <div class="divider"></div>
                        
                        <div class="highlights-title">Características principales:</div>
                        <ul class="highlights-list">
                            ${specsLines.map(line => `<li>${line}</li>`).join('')}
                        </ul>
                    </div>

                    <!-- Columna 3: Buy Box -->
                    <aside class="buy-box">
                        <div>
                            <div class="price-main">${mainPriceText}</div>
                            <div class="price-bs">${subPriceText}</div>
                        </div>

                        ${prices.mayor ? `
                            <div class="wholesale-box">
                                📦 <strong>Precio al Mayor:</strong> ${prices.mayor} <span style="color:var(--text-muted)">(Consulta condiciones)</span>
                            </div>
                        ` : ''}

                        <div class="stock-status ${isOutOfStock ? 'stock-out' : 'stock-in'}">
                            ${isOutOfStock ? '❌ Agotado temporalmente' : '✅ Disponible para entrega inmediata'}
                        </div>

                        ${!isOutOfStock ? `
                            <div class="qty-row">
                                <span style="font-size:0.88rem; font-weight:600;">Cantidad:</span>
                                <div class="qty-selector">
                                    <button type="button" onclick="updateQty(-1)">−</button>
                                    <span id="qtyValue">${selectedQty}</span>
                                    <button type="button" onclick="updateQty(1)">+</button>
                                </div>
                            </div>
                        ` : ''}

                        <button class="btn-buy btn-add-cart" onclick="handleAddToCart()" ${isOutOfStock ? 'disabled' : ''}>
                            🛒 Agregar al Carrito
                        </button>

                        <button class="btn-buy btn-whatsapp" onclick="handleDirectWhatsApp()" ${isOutOfStock ? 'disabled' : ''}>
                            💬 Comprar por WhatsApp
                        </button>

                        <div class="trust-list">
                            <div>🛡️ <strong>Compra 100% Segura:</strong> Garantía directa en Barquisimeto.</div>
                            <div>🚚 <strong>Entregas:</strong> Delivery local y envíos nacionales (MRW/Zoom).</div>
                            <div>💳 <strong>Pagos:</strong> Pago Móvil, Transferencia, Efectivo y Binance.</div>
                        </div>
                    </aside>
                </div>
            `;

            if (prod.descripcion && prod.descripcion.trim() !== '') {
                document.getElementById('descriptionSection').style.display = 'block';
                document.getElementById('fullDescription').textContent = prod.descripcion.replace(/\\n/g, '\n');
            }
        }

        // ========== INTERACCIONES DE GALERÍA Y COMPRA ==========
        function switchMainImage(src, thumbEl) {
            document.getElementById('mainProductImg').src = src;
            document.querySelectorAll('.thumb-item').forEach(t => t.classList.remove('active'));
            thumbEl.classList.add('active');
        }

        function updateQty(delta) {
            selectedQty = Math.max(1, selectedQty + delta);
            document.getElementById('qtyValue').textContent = selectedQty;
        }

        function handleAddToCart() {
            if (!currentProduct) return;
            const cart = getCart();
            const prices = getFormattedPrices(currentProduct);
            const imgProxied = proxyImg(currentProduct.imagen_url);

            const existing = cart.find(i => i.name === currentProduct.nombre);
            if (existing) {
                existing.quantity = (existing.quantity || 1) + selectedQty;
            } else {
                cart.push({
                    id: currentProduct.id_producto,
                    name: currentProduct.nombre,
                    priceUSD: `$${prices.rawUsd.toFixed(2)}`,
                    image: imgProxied,
                    quantity: selectedQty
                });
            }

            localStorage.setItem('edrunners_cart', JSON.stringify(cart));
            updateCartBadge();
            showToast(`✅ Agregado (${selectedQty}) al carrito`);
        }

        function handleDirectWhatsApp() {
            if (!currentProduct) return;
            const prices = getFormattedPrices(currentProduct);
            const totalUsd = (prices.rawUsd * selectedQty).toFixed(2);
            const msg = `¡Hola EDRunners! Me interesa comprar este producto:\n\n` +
                        `📦 *${currentProduct.nombre}*\n` +
                        `🆔 Código: ${currentProduct.id_producto}\n` +
                        `🔢 Cantidad: ${selectedQty}\n` +
                        `💵 Total estimado: $${totalUsd}\n\n` +
                        `🔗 Link: ${window.location.href}`;
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        // ========== PRODUCTOS RELACIONADOS ==========
        function renderRelated(prod) {
            if (!prod.relacionados || prod.relacionados.trim() === '') return;

            const relIds = prod.relacionados.split(',').map(id => id.trim().toLowerCase()).filter(Boolean);
            const matched = allProducts.filter(p => relIds.includes(String(p.id_producto).trim().toLowerCase()));

            if (matched.length === 0) return;

            const section = document.getElementById('relatedSection');
            const grid = document.getElementById('relatedGrid');
            section.style.display = 'block';

            grid.innerHTML = matched.map(item => {
                const prices = getFormattedPrices(item);
                const displayPrice = showUSD ? prices.usd : prices.bs;
                return `
                    <a href="producto.html?id=${encodeURIComponent(item.id_producto)}" class="rel-card">
                        <div>
                            <div class="rel-img">
                                <img src="${proxyImg(item.imagen_url)}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'" alt="${item.nombre}">
                            </div>
                            <div class="rel-title">${item.nombre}</div>
                        </div>
                        <div class="rel-price">${displayPrice}</div>
                    </a>
                `;
            }).join('');
        }

        // ========== INICIALIZACIÓN PRINCIPAL ==========
        async function initProductPage() {
            updateCartBadge();
            const params = new URLSearchParams(window.location.search);
            const targetId = params.get('id');

            if (!targetId) {
                renderNotFound("No se especificó ningún código de producto en el enlace.");
                return;
            }

            try {
                const [confRes, prodRes] = await Promise.all([fetch(CONFIG_CSV_URL), fetch(PRODUCTS_CSV_URL)]);
                if (confRes.ok) {
                    const confText = await confRes.text();
                    confText.split(/\r?\n/).forEach(line => {
                        if (line.toLowerCase().includes('tasa_bs_usd')) {
                            const val = parseFloat(line.split(',')[1]);
                            if (!isNaN(val)) exchangeRate = val;
                        }
                    });
                }

                if (prodRes.ok) {
                    allProducts = parseCSV(await prodRes.text());
                    currentProduct = allProducts.find(p => String(p.id_producto).trim().toLowerCase() === targetId.trim().toLowerCase());

                    if (!currentProduct) {
                        renderNotFound(`No encontramos ningún producto con el código "${targetId}".`);
                        return;
                    }

                    renderProductPage(currentProduct);
                    renderRelated(currentProduct);
                }
            } catch (err) {
                console.error(err);
                renderNotFound("Error de conexión al cargar los datos del producto.");
            }
        }

        function renderNotFound(message) {
            document.title = "Producto no encontrado | EDRunners";
            document.getElementById('bcCategory').textContent = "No encontrado";
            document.getElementById('productContainer').innerHTML = `
                <div class="state-box">
                    <h2 style="margin-bottom: 10px;">😕 Producto no disponible</h2>
                    <p style="color: var(--text-muted); margin-bottom: 24px;">${message}</p>
                    <button onclick="goBackStore()" class="btn-buy btn-add-cart" style="max-width: 260px; margin: 0 auto;">
                        Volver al Catálogo
                    </button>
                </div>
            `;
        }

        initProductPage();
    </script>
</body>
</html>
