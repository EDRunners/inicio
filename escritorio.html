<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDRunners Pro | Escritorio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* ========== ESTILOS (manteniendo el diseño de Gemini) ========== */
        :root {
            --bg-color: #0f1012;
            --surface-color: #1a1b1e;
            --surface-hover: #232428;
            --primary-color: #10b981;
            --primary-hover: #059669;
            --text-light: #ffffff;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.05);
            --glow: 0 0 25px rgba(16, 185, 129, 0.2);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.tema-claro {
            --bg-color: #f3f4f6;
            --surface-color: #ffffff;
            --surface-hover: #f9fafb;
            --text-light: #111827;
            --text-muted: #6b7280;
            --border-color: rgba(0, 0, 0, 0.08);
            --glow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-light); line-height: 1.6; transition: var(--transition); overflow-x: hidden; }
        a { text-decoration: none; color: inherit; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary-color); }

        /* ========== COMPONENTES GENERALES ========== */
        .container { max-width: 1400px; margin: 0 auto; padding: 0 40px; }
        .text-primary { color: var(--primary-color); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; background-color: var(--primary-color); color: #fff; border-radius: 8px; font-weight: 600; cursor: pointer; transition: var(--transition); border: none; }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: var(--glow); }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-light); }
        .btn-outline:hover { border-color: var(--primary-color); color: var(--primary-color); background: rgba(16,185,129,0.05); }

        /* ========== HEADER ========== */
        header { position: fixed; top: 0; width: 100%; background: rgba(15, 16, 18, 0.85); backdrop-filter: blur(12px); z-index: 1000; border-bottom: 1px solid var(--border-color); padding: 15px 0; transition: var(--transition); }
        body.tema-claro header { background: rgba(255, 255, 255, 0.9); }
        .header-grid { display: grid; grid-template-columns: auto 1fr auto; gap: 40px; align-items: center; }
        .logo { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; }
        .search-container { position: relative; max-width: 600px; width: 100%; justify-self: center; }
        .search-input { width: 100%; padding: 12px 20px 12px 45px; background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 30px; color: var(--text-light); font-size: 1rem; transition: var(--transition); }
        .search-input:focus { border-color: var(--primary-color); outline: none; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }
        .search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        
        /* ========== HERO + CAROUSEL ========== */
        .hero-section { padding: 140px 0 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 50px; align-items: center; min-height: 70vh; }
        .hero-content h1 { font-size: 4rem; line-height: 1.1; margin-bottom: 20px; }
        .hero-content p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; max-width: 90%; }
        .carousel-desktop { position: relative; border-radius: 24px; overflow: hidden; box-shadow: var(--glow); border: 1px solid var(--border-color); aspect-ratio: 16/9; }
        .carousel-slides { display: flex; height: 100%; transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1); }
        .carousel-slide { min-width: 100%; height: 100%; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; }
        .carousel-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; transition: var(--transition); backdrop-filter: blur(5px); }
        .carousel-btn:hover { background: var(--primary-color); }
        .carousel-btn.prev { left: 20px; }
        .carousel-btn.next { right: 20px; }

        /* ========== TIENDA ========== */
        .shop-container { display: grid; grid-template-columns: 250px 1fr; gap: 40px; padding: 60px 0; align-items: start; }
        .sidebar { position: sticky; top: 100px; background: var(--surface-color); padding: 30px; border-radius: 16px; border: 1px solid var(--border-color); }
        .sidebar h3 { margin-bottom: 20px; font-size: 1.2rem; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
        .category-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .category-btn { width: 100%; text-align: left; background: transparent; border: none; color: var(--text-muted); padding: 10px 15px; border-radius: 8px; cursor: pointer; transition: var(--transition); font-size: 1rem; display: flex; justify-content: space-between; }
        .category-btn:hover { background: var(--surface-hover); color: var(--text-light); }
        .category-btn.active { background: rgba(16,185,129,0.1); color: var(--primary-color); font-weight: 600; border-left: 3px solid var(--primary-color); }
        .products-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card { background: var(--surface-color); border: 1px solid var(--border-color); border-radius: 16px; padding: 25px; transition: var(--transition); position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(16,185,129,0.3); box-shadow: var(--glow); }
        .product-image { width: 100%; height: 220px; border-radius: 12px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.02); position: relative; }
        .product-image img { max-width: 90%; max-height: 90%; object-fit: contain; transition: transform 0.5s; }
        .product-card:hover .product-image img { transform: scale(1.08); }
        .product-info { flex-grow: 1; display: flex; flex-direction: column; }
        .product-title { font-size: 1.1rem; margin-bottom: 8px; }
        .product-specs { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 15px; flex-grow: 1; }
        .product-price-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .product-price { font-size: 1.4rem; font-weight: 700; color: var(--primary-color); }
        .badge-stock { position: absolute; top: 20px; right: 20px; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; z-index: 2; }
        .badge-agotado { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef4444; }
        .badge-pocas { background: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid #f59e0b; }

        /* ========== CARRITO MODAL (lateral) ========== */
        .cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1999; display: none; opacity: 0; transition: opacity 0.3s; }
        .cart-sidebar { position: fixed; top: 0; right: -450px; width: 450px; height: 100vh; background: var(--surface-color); z-index: 2000; padding: 30px; box-shadow: -10px 0 30px rgba(0,0,0,0.2); transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; border-left: 1px solid var(--border-color); }
        .cart-sidebar.open { right: 0; }
        .cart-overlay.open { display: block; opacity: 1; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
        .close-cart { background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; }
        .cart-items { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; padding-right: 10px; }
        .cart-item { display: grid; grid-template-columns: 60px 1fr auto; gap: 15px; align-items: center; background: var(--bg-color); padding: 15px; border-radius: 12px; }
        .cart-item img { width: 100%; height: 60px; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 6px; }
        .cart-footer { padding-top: 20px; border-top: 1px solid var(--border-color); margin-top: 20px; }
        .cart-total-row { display: flex; justify-content: space-between; font-size: 1.3rem; font-weight: 700; margin-bottom: 20px; }

        /* ========== Skeleton ========== */
        .skeleton { background: linear-gradient(90deg, var(--surface-color) 25%, var(--bg-color) 50%, var(--surface-color) 75%); background-size: 200% 100%; animation: loading 1.5s infinite; border-radius: 8px; }
        @keyframes loading { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .whatsapp-float { position: fixed; bottom: 40px; right: 40px; background: #25D366; color: white; width: 65px; height: 65px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 35px; z-index: 999; box-shadow: 0 10px 20px rgba(37,211,102,0.3); transition: var(--transition); }
        .whatsapp-float:hover { transform: translateY(-5px) scale(1.05); }

        /* ========== MODAL DE DETALLES (estilo escritorio) ========== */
        .detail-modal .modal-content { max-width: 600px; max-height: 85vh; overflow-y: auto; }
        .detail-images { display: flex; gap: 8px; overflow-x: auto; margin: 15px 0; padding-bottom: 10px; }
        .detail-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .detail-thumb.active { border-color: var(--primary-color); }
        .detail-main-image { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; margin-bottom: 10px; }
        .detail-desc { margin: 15px 0; line-height: 1.5; text-align: left; white-space: pre-wrap; }
    </style>
</head>

<script>
    // ========== CONFIGURACIÓN ==========
    const PRODUCTS_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGjMz9Zwo1g8PruSjNcSJq6kTUQrEGkN_hQRBH0dvjIA_IwwKQ5p2pb7Bmrnvd7sLB2hMvqj-oFR6L/pub?output=csv";
    const CONFIG_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRGjMz9Zwo1g8PruSjNcSJq6kTUQrEGkN_hQRBH0dvjIA_IwwKQ5p2pb7Bmrnvd7sLB2hMvqj-oFR6L/pub?gid=1&output=csv";

    let allProducts = [];
    let currentCategory = 'todos';
    let exchangeRate = 530.5;
    let showUSD = true;
    let cart = JSON.parse(localStorage.getItem('edrunners_cart')) || [];

    // ========== TEMA ==========
    const temaBtn = document.getElementById('temaBtn');
    if (localStorage.getItem('tema') === 'claro') { document.body.classList.add('tema-claro'); temaBtn.textContent = '☀️'; }
    temaBtn.addEventListener('click', () => {
        document.body.classList.toggle('tema-claro');
        if (document.body.classList.contains('tema-claro')) { localStorage.setItem('tema', 'claro'); temaBtn.textContent = '☀️'; }
        else { localStorage.setItem('tema', 'oscuro'); temaBtn.textContent = '🌙'; }
    });

    // ========== MONEDA ==========
    const currencyBtn = document.getElementById('currencyBtn');
    currencyBtn.addEventListener('click', () => {
        showUSD = !showUSD;
        currencyBtn.textContent = showUSD ? '💰 USD' : '💰 Bs';
        renderProducts(allProducts.filter(p => currentCategory === 'todos' || p.categoria === currentCategory));
        renderCart();
    });

    // ========== PARSEO DE CSV (con descripcion e imagenes_extra) ==========
    function parseCSV(csvText) {
        const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        const products = [];
        for (let i = 1; i < lines.length; i++) {
            let values = [], inQuote = false, current = '';
            for (let ch of lines[i]) {
                if (ch === '"') inQuote = !inQuote;
                else if (ch === ',' && !inQuote) { values.push(current.trim()); current = ''; }
                else current += ch;
            }
            values.push(current.trim());
            const getValue = (key) => { const idx = headers.indexOf(key); return idx !== -1 ? values[idx] : ''; };
            const nombre = getValue('nombre');
            if (!nombre) continue;
            products.push({
                id_producto: getValue('id_producto') || nombre.replace(/\s/g, '-').toLowerCase(),
                nombre: nombre,
                especificaciones: getValue('especificaciones'),
                precio: getValue('precio'),
                imagen_url: getValue('imagen_url'),
                categoria: getValue('categoria') || 'general',
                stock: getValue('stock') || 'disponible',
                descripcion: getValue('descripcion') || '',
                imagenes_extra: getValue('imagenes_extra') || ''
            });
        }
        return products;
    }

    async function fetchData() {
        try {
            const [confRes, prodRes] = await Promise.all([ fetch(CONFIG_CSV_URL), fetch(PRODUCTS_CSV_URL) ]);
            if (confRes.ok) {
                const confLines = (await confRes.text()).split(/\r?\n/);
                for(let line of confLines) {
                    if (line.toLowerCase().includes('tasa_bs_usd')) {
                        const val = parseFloat(line.split(',')[1]);
                        if(!isNaN(val)) exchangeRate = val;
                    }
                }
            }
            if (prodRes.ok) {
                allProducts = parseCSV(await prodRes.text()).reverse();
                buildCategories();
                renderProducts(allProducts);
            }
        } catch(e) {
            console.error("Error cargando base de datos", e);
            document.getElementById('desktopProductGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center;">Error de conexión. Intente recargar.</div>';
        }
    }

    // ========== CATEGORÍAS ==========
    function buildCategories() {
        const catList = document.getElementById('categoryList');
        const categories = [...new Set(allProducts.map(p => p.categoria.toLowerCase()))];
        categories.sort().forEach(cat => {
            const count = allProducts.filter(p => p.categoria.toLowerCase() === cat).length;
            const li = document.createElement('li');
            li.innerHTML = `<button class="category-btn" data-cat="${cat}">${cat.charAt(0).toUpperCase() + cat.slice(1)} <span>${count}</span></button>`;
            catList.appendChild(li);
        });
        document.querySelectorAll('.category-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.getAttribute('data-cat');
                const filtered = currentCategory === 'todos' ? allProducts : allProducts.filter(p => p.categoria.toLowerCase() === currentCategory);
                renderProducts(filtered);
            });
        });
    }

    function formatPrice(precioStr) {
        let priceNum = parseFloat(precioStr.replace(/[^0-9.]/g, ''));
        if (isNaN(priceNum)) return precioStr;
        return showUSD ? `$${priceNum.toFixed(2)}` : `Bs ${(priceNum * exchangeRate).toFixed(2)}`;
    }

    // ========== RENDER PRODUCTOS (con modal) ==========
    function renderProducts(products) {
        const grid = document.getElementById('desktopProductGrid');
        document.getElementById('resultsCount').innerText = `${products.length} producto(s)`;
        if (products.length === 0) {
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px;">No se encontraron productos.</div>';
            return;
        }
        grid.innerHTML = products.map((p, idx) => {
            let badge = '';
            if (p.stock === 'agotado' || p.stock === '0') badge = '<div class="badge-stock badge-agotado">Agotado</div>';
            else if (p.stock === 'pocas') badge = '<div class="badge-stock badge-pocas">Últimas uds.</div>';
            const precioDisplay = formatPrice(p.precio);
            const imgSrc = p.imagen_url || 'https://via.placeholder.com/250?text=EDRunners';
            return `
            <div class="product-card">
                ${badge}
                <div class="product-image"><img src="${imgSrc}" loading="lazy" alt="${p.nombre}"></div>
                <div class="product-info">
                    <h3 class="product-title">${p.nombre}</h3>
                    <p class="product-specs">${p.especificaciones}</p>
                    <div class="product-price-row">
                        <span class="product-price">${precioDisplay}</span>
                    </div>
                    <div class="product-actions" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; opacity:0; transform:translateY(15px); transition:all 0.4s ease;">
                        <button class="btn-card btn-add" onclick="addToCart('${p.nombre.replace(/'/g, "\\'")}', '${p.precio}', '${imgSrc}')" ${badge.includes('Agotado') ? 'disabled style="opacity:0.5"' : ''}>+ Carrito</button>
                        <button class="btn-card btn-view" data-idx="${idx}" style="background:var(--primary-color); color:white; border:none;">Ver Detalles</button>
                    </div>
                </div>
            </div>`;
        }).join('');

        // Eventos para los botones "Ver Detalles"
        document.querySelectorAll('.btn-view[data-idx]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const idx = parseInt(btn.getAttribute('data-idx'));
                const product = products[idx];
                // Obtener imagenes_extra
                let imagenesExtra = [];
                if (product.imagenes_extra && typeof product.imagenes_extra === 'string' && product.imagenes_extra.trim()) {
                    imagenesExtra = product.imagenes_extra.split(',').map(s => s.trim().replace(/^["']|["']$/g, '')).filter(s => s && s !== '' && (s.startsWith('http://') || s.startsWith('https://')));
                }
                openDetailModal(product, imagenesExtra);
            });
        });

        // Mostrar acciones al hover (ya que el CSS las oculta)
        document.querySelectorAll('.product-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const actions = card.querySelector('.product-actions');
                if (actions) { actions.style.opacity = '1'; actions.style.transform = 'translateY(0)'; }
            });
            card.addEventListener('mouseleave', () => {
                const actions = card.querySelector('.product-actions');
                if (actions) { actions.style.opacity = '0'; actions.style.transform = 'translateY(15px)'; }
            });
        });
    }

    // ========== MODAL DE DETALLES (Escritorio) ==========
    function openDetailModal(product, imagenesExtraArray = []) {
        const modal = document.getElementById('detailModal');
        document.getElementById('detalleNombre').textContent = product.nombre;
        const allImages = [product.imagen_url, ...imagenesExtraArray].filter(url => url && typeof url === 'string' && url.trim() !== '' && (url.startsWith('http') || url.startsWith('https')));
        document.getElementById('detalleImagen').src = allImages.length > 0 ? allImages[0] : '';
        document.getElementById('detalleImagen').alt = product.nombre;
        // Miniaturas
        const thumbContainer = document.getElementById('detalleThumbnails');
        thumbContainer.innerHTML = '';
        if (allImages.length > 1) {
            allImages.forEach((imgUrl, idx) => {
                const thumb = document.createElement('img');
                thumb.src = imgUrl;
                thumb.className = 'detail-thumb';
                if (idx === 0) thumb.classList.add('active');
                thumb.style.width = '80px';
                thumb.style.height = '80px';
                thumb.style.objectFit = 'cover';
                thumb.style.borderRadius = '8px';
                thumb.style.cursor = 'pointer';
                thumb.style.border = '2px solid transparent';
                thumb.addEventListener('click', () => {
                    document.getElementById('detalleImagen').src = imgUrl;
                    document.querySelectorAll('.detail-thumb').forEach(t => t.classList.remove('active'));
                    thumb.classList.add('active');
                });
                thumbContainer.appendChild(thumb);
            });
        } else {
            thumbContainer.innerHTML = '<div style="color:var(--text-muted); font-size:0.9rem;">No hay imágenes adicionales</div>';
        }
        document.getElementById('detalleEspecificaciones').textContent = product.especificaciones || '';
        document.getElementById('detalleDescripcion').innerHTML = (product.descripcion || '').replace(/\n/g, '<br>');
        let precioDisplay = '';
        if (product.precio) {
            let priceNum = parseFloat(product.precio.replace('$', '').replace(' USD', '').trim());
            if (!isNaN(priceNum)) {
                precioDisplay = showUSD ? `$${priceNum.toFixed(2)}` : `Bs ${(priceNum * exchangeRate).toFixed(2)}`;
            } else {
                precioDisplay = product.precio;
            }
        } else {
            precioDisplay = 'Consultar precio';
        }
        document.getElementById('detallePrecio').textContent = precioDisplay;
        document.getElementById('detalleLinkWa').href = product.link_wa || `https://wa.me/584129056964?text=Hola,%20me%20interesa%20${encodeURIComponent(product.nombre)}`;
        modal.style.display = 'flex';
    }

    function closeDetailModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    // Cerrar modal de detalles (click fuera o en la X)
    document.querySelector('.close-detail-modal').addEventListener('click', closeDetailModal);
    window.addEventListener('click', (e) => {
        if (e.target === document.getElementById('detailModal')) closeDetailModal();
    });

    // ========== BUSCADOR ==========
    document.getElementById('desktopSearchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        let filtered = allProducts.filter(p => (currentCategory === 'todos' || p.categoria === currentCategory) && 
            (p.nombre.toLowerCase().includes(term) || p.especificaciones.toLowerCase().includes(term)));
        renderProducts(filtered);
    });

    // ========== CARRITO ==========
    function saveCart() { localStorage.setItem('edrunners_cart', JSON.stringify(cart)); renderCart(); }
    function addToCart(name, priceUSD, image) {
        const exist = cart.find(i => i.name === name);
        if (exist) exist.quantity++;
        else cart.push({ name, priceUSD, image, quantity: 1 });
        saveCart();
        document.getElementById('cartSidebar').classList.add('open');
        document.getElementById('cartOverlay').classList.add('open');
    }
    function renderCart() {
        document.getElementById('cartBadge').innerText = cart.reduce((s, i) => s + i.quantity, 0);
        const container = document.getElementById('desktopCartItems');
        if(cart.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:50px;">Tu carrito está vacío.</div>';
            document.getElementById('desktopCartTotal').innerText = showUSD ? '$0.00' : 'Bs 0.00';
            return;
        }
        let totalUSD = 0;
        container.innerHTML = cart.map((item, index) => {
            let priceNum = parseFloat(item.priceUSD.replace(/[^0-9.]/g, '')) || 0;
            totalUSD += priceNum * item.quantity;
            let displayPrice = showUSD ? `$${priceNum.toFixed(2)}` : `Bs ${(priceNum * exchangeRate).toFixed(2)}`;
            return `
            <div class="cart-item">
                <img src="${item.image}" alt="">
                <div>
                    <div style="font-weight:600; font-size:0.9rem">${item.name}</div>
                    <div style="color:var(--primary-color); font-size:0.85rem">${displayPrice}</div>
                </div>
                <div style="display:flex; align-items:center; gap:10px; background:var(--surface-color); padding:5px 10px; border-radius:6px; border:1px solid var(--border-color);">
                    <button onclick="changeQty(${index}, -1)" style="background:none; border:none; color:var(--text-light); cursor:pointer;">-</button>
                    <span style="font-size:0.9rem">${item.quantity}</span>
                    <button onclick="changeQty(${index}, 1)" style="background:none; border:none; color:var(--text-light); cursor:pointer;">+</button>
                </div>
            </div>`;
        }).join('');
        document.getElementById('desktopCartTotal').innerText = showUSD ? `$${totalUSD.toFixed(2)}` : `Bs ${(totalUSD * exchangeRate).toFixed(2)}`;
    }
    function changeQty(index, delta) {
        cart[index].quantity += delta;
        if(cart[index].quantity <= 0) cart.splice(index, 1);
        saveCart();
    }

    // Eventos carrito
    document.getElementById('cartIconDesktop').addEventListener('click', () => {
        document.getElementById('cartSidebar').classList.add('open');
        document.getElementById('cartOverlay').classList.add('open');
    });
    document.getElementById('closeCartBtn').addEventListener('click', closeCart);
    document.getElementById('cartOverlay').addEventListener('click', closeCart);
    document.getElementById('clearCartBtn').addEventListener('click', () => { cart = []; saveCart(); });
    function closeCart() {
        document.getElementById('cartSidebar').classList.remove('open');
        document.getElementById('cartOverlay').classList.remove('open');
    }
    document.getElementById('checkoutBtn').addEventListener('click', () => {
        if(cart.length === 0) return alert("Agrega productos primero");
        let msg = "¡Hola! Quisiera procesar la compra de estos equipos:\n\n";
        cart.forEach(i => {
            let priceNum = parseFloat(i.priceUSD.replace(/[^0-9.]/g, '')) || 0;
            msg += `▫️ ${i.quantity}x ${i.name} ($${priceNum.toFixed(2)})\n`;
        });
        msg += `\nTotal estimado: ${document.getElementById('desktopCartTotal').innerText}`;
        window.open(`https://wa.me/584129056964?text=${encodeURIComponent(msg)}`, '_blank');
    });

    // ========== CAROUSEL ==========
    let currentSlide = 0;
    function moveCarousel(dir) {
        const track = document.getElementById('mainCarousel');
        const slides = track.children.length;
        currentSlide = (currentSlide + dir + slides) % slides;
        track.style.transform = `translateX(-${currentSlide * 100}%)`;
    }
    setInterval(() => moveCarousel(1), 5000);

    // Iniciar
    fetchData();
    renderCart();
</script>
</body>
</html>
